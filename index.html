<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ks89service - บริการและผลงาน</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #e0e0e0;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        h1 {
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 10px;
        }
        p.subtitle {
            color: #666;
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
        .btn-outline {
            background-color: transparent;
            color: #2563eb;
            border: 2px solid #2563eb;
        }
        .btn-outline:hover {
            background-color: #eff6ff;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="profile-img">🛠️</div>
        <h1>ks89service</h1>
        <p class="subtitle">ยินดีต้อนรับสู่เว็บไซต์อย่างเป็นทางการของเรา<br>เราพร้อมให้บริการด้วยคุณภาพและความเอาใจใส่</p>

        <a href="https://github.com/ks89service" class="btn">ดูผลงานบน GitHub</a>
        <a href="mailto:your-email@example.com" class="btn btn-outline">ติดต่อเรา</a>
    </div>

</body>
</html>
